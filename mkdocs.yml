site_name: "Nextflow for HPC workshop materials"
repo_url: "https://github.com/Sydney-Informatics-Hub/nf4hpc-materials"
repo_name: "Sydney-Informatics-Hub/nf4hpc-materials"

nav:
  # INSTRUCTOR_START
  - Home: index.md
  - Instructor guides:
      - Training logistics: instructor/logistics.md
      - Training infrastructure: instructor/environment.md
      - Training materials:
        - Materials guide: instructor/materials.md
        - Part 1: instructor/pt1-guide.md
        - Part 2: instructor/pt2-guide.md
  # INSTRUCTOR_END
  - Example workshop materials:
      - Home: workshop/index.md
      - Setup: workshop/setup.md
      - Part 1:
        - 1.0 Introduction: workshop/part1/01_0_intro.md
        - 1.1 HPC for bioinformatics workflows: workshop/part1/01_1_hpc_for_workflows.md
        - 1.2 Software is different on HPC: workshop/part1/01_2_hpc_software.md
        - 1.3 HPC architecture: workshop/part1/01_3_hpc_architecture.md
        - 1.4 Work smarter, not harder!: workshop/part1/01_4_smarter.md
        - 1.5 Running Nextflow on HPC: workshop/part1/01_5_nf_hpc.md
        - 1.6 Intro to nf-core: workshop/part1/01_6_nfcore_intro.md
        - 1.7 Running nf-core on HPC: workshop/part1/01_7_nfcore_run.md
        - 1.8 Configuring nf-core: workshop/part1/01_8_nfcore_config.md
        - 1.9 Layering Nextflow configurations: workshop/part1/01_9_nfcore_layer.md
        - 1.10 Summary: workshop/part1/01_10_outro.md
      - Part 2:
        - 2.0 Introduction: workshop/part2/20_intro.md
        - 2.1 Running a custom pipeline on HPC: workshop/part2/21_firstrun.md
        - 2.2 Pipeline monitoring and reporting: workshop/part2/22_reporting.md
        - 2.3 Optimising Nextflow for HPC: workshop/part2/23_strategies.md
        - 2.4 Assigning process resources: workshop/part2/24_resourcing.md
        - 2.5 Parallelisation: workshop/part2/25_parallelisation.md
        - 2.7 Scale to multiple samples: workshop/part2/27_scale.md
        - Summary and takeaways: workshop/part2/28_outro.md

theme:
  name: material
  logo: assets/usyd-logo.png
  features:
    - navigation.footer
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      preserve_tabs: true
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  analytics:
    provider: google
    property: G-TNWWV3HK57